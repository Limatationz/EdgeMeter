# XcodeGen spec. Regenerate the project with:  xcodegen generate
# (brew install xcodegen). Kaliber.xcodeproj is checked in for convenience,
# but project.yml is the source of truth.
name: Kaliber
options:
  bundleIdPrefix: de.ErikRill
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: $(ARCHS_STANDARD)
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO      # universal binary for releases (FEATURES.md 16.5)

packages:
  KaliberCore:
    path: Packages/KaliberCore

targets:
  Kaliber:
    type: application
    platform: macOS
    sources:
      - path: App/Kaliber
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: KaliberCore
    info:
      path: App/Kaliber/Info.plist
      properties:
        CFBundleName: Kaliber
        CFBundleDisplayName: Kaliber
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true            # menu-bar app, no Dock icon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
    entitlements:
      path: App/Kaliber/Kaliber.entitlements
      properties:
        # Hardened runtime without sandbox for now: ScreenCaptureKit works
        # either way, but global hotkeys and per-app logic are simpler unsandboxed.
        # Revisit for a Mac App Store build (FEATURES.md 16.4).
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.ErikRill.Kaliber
        DEVELOPMENT_TEAM: 25ZPKD8P86     # Erik Rill (personal team)
        PRODUCT_NAME: Kaliber
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"   # Developer ID for notarized releases later
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Kaliber/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Kaliber/Kaliber.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - package: KaliberCore/KaliberCoreTests
