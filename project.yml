# XcodeGen spec. Regenerate the project with:  xcodegen generate
# (brew install xcodegen). EdgeMeter.xcodeproj is checked in for convenience,
# but project.yml is the source of truth.
name: EdgeMeter
options:
  bundleIdPrefix: de.ErikRill
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: $(ARCHS_STANDARD)
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO      # universal binary for releases (FEATURES.md 16.5)

packages:
  EdgeMeterCore:
    path: Packages/EdgeMeterCore

targets:
  EdgeMeter:
    type: application
    platform: macOS
    sources:
      - path: App/EdgeMeter
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: EdgeMeterCore
    info:
      path: App/EdgeMeter/Info.plist
      properties:
        CFBundleName: EdgeMeter
        CFBundleDisplayName: EdgeMeter
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true            # menu-bar app, no Dock icon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
    entitlements:
      path: App/EdgeMeter/EdgeMeter.entitlements
      properties:
        # Hardened runtime without sandbox for now: ScreenCaptureKit works
        # either way, but global hotkeys and per-app logic are simpler unsandboxed.
        # Revisit for a Mac App Store build (FEATURES.md 16.4).
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.ErikRill.EdgeMeter
        DEVELOPMENT_TEAM: 25ZPKD8P86     # Erik Rill (personal team)
        PRODUCT_NAME: EdgeMeter
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"   # Developer ID for notarized releases later
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/EdgeMeter/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/EdgeMeter/EdgeMeter.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - package: EdgeMeterCore/EdgeMeterCoreTests
